<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商户管理系统后台 - 账目清算中心</title>
    <style>
        /* 全局深邃暗黑商业美学 - 深度契合前台与收银台设计 */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0b0b0c; color: #e1e1e6; padding: 40px 20px; margin: 0; box-sizing: border-box; }
        .container { max-width: 1200px; margin: 0 auto; background: #151518; border-radius: 16px; border: 1px solid #222226; padding: 35px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); display: none; }
        
        /* 登录验证大盒子 */
        .login-box { max-width: 360px; margin: 120px auto; background: #151518; padding: 40px 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); text-align: center; border: 1px solid #222226; }
        .login-box h3 { color: #fff; margin-top: 0; font-size: 22px; font-weight: bold; margin-bottom: 5px; }
        .login-box p { color: #8d8d99; font-size: 13px; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #a8a8b3; font-weight: 500; }
        input { width: 100%; padding: 13px; border: 1px solid #2d2d34; background: #0b0b0c; color: #fff; border-radius: 8px; box-sizing: border-box; font-size: 14px; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #4f46e5; }
        
        /* 按钮大军样式 */
        .btn { background: #4f46e5; color: white; border: none; padding: 13px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; transition: background 0.2s; }
        .btn:hover { background: #4338ca; }
        .btn-group { display: flex; gap: 12px; }
        .btn-action { padding: 8px 16px; width: auto; font-size: 13px; font-weight: bold; border-radius: 6px; }
        .btn-clear { background: #dc2626; }
        .btn-clear:hover { background: #b91c1c; }
        .btn-export { background: #059669; }
        .btn-export:hover { background: #047857; }
        
        /* 顶部看板状态区域 */
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222226; padding-bottom: 20px; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .dashboard-header h2 { color: #fff; margin: 0; font-size: 24px; font-weight: bold; }
        
        /* 营业额简易看板快报 */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #1c1c21; border: 1px solid #2d2d34; padding: 20px; border-radius: 12px; text-align: left; }
        .stat-card .title { font-size: 13px; color: #8d8d99; margin-bottom: 5px; }
        .stat-card .value { font-size: 24px; font-weight: bold; color: #fff; }
        .stat-card .value.green { color: #04d361; }
        
        /* 金融级表格总样式 */
        .table-wrapper { width: 100%; overflow-x: auto; border-radius: 8px; border: 1px solid #222226; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; background: #151518; min-width: 900px; }
        th, td { border-bottom: 1px solid #222226; padding: 15px; }
        th { background-color: #0b0b0c; color: #8d8d99; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
        tr:hover { background-color: #1c1c21; }
        
        /* 徽章样式：区分通道 */
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; display: inline-block; }
        .badge-card { background: rgba(59, 130, 246, 0.15); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.2); }
        .badge-crypto { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        
        .token-text { font-family: monospace; color: #a8a8b3; font-weight: 500; background: #0b0b0c; padding: 4px 8px; border-radius: 6px; border: 1px solid #222226; display: inline-block; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; cursor: pointer; }
        .token-text:hover { color: #fff; border-color: #4f46e5; }
    </style>
</head>
<body>

<!-- 🔒 第一层：管理员密码风控验证 -->
<div id="login-section" class="login-box">
    <h3>商户管理系统</h3>
    <p>请输入唯一的安全控制密钥登入后台</p>
    <div class="input-group">
        <label for="admin-password">安全控制密码</label>
        <input type="password" id="admin-password" placeholder="请输入系统管理密码" on穩key="if(event.keyCode==13) verifyLogin()">
    </div>
    <button class="btn" onclick="verifyLogin()">验证并加载主控台</button>
</div>

<!-- 📊 第二层：核心数据主控面板（默认完全隐藏，通过代码解锁） -->
<div id="dashboard-section" class="container">
    <div class="dashboard-header">
        <h2>TastySlips 商户流水清算中心</h2>
        <div class="btn-group">
            <button class="btn btn-action btn-export" onclick="exportToCSV()">导出当前账目明细 (.csv)</button>
            <button class="btn btn-action btn-clear" onclick="clearDatabase()">清空历史流水记录</button>
        </div>
    </div>

    <!-- 营业快报统计牌 -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="title">今日系统状态</div>
            <div class="value green">ONLINE 运行中</div>
        </div>
        <div class="stat-card">
            <div class="title">全局交易笔数</div>
            <div id="stat-count" class="value">0 笔</div>
        </div>
        <div class="stat-card">
            <div class="title">总计流水总额 (模拟统计)</div>
            <div id="stat-sum" class="value" style="color: #ef4444;">$0.00 USD</div>
        </div>
    </div>
    
    <!-- 数据中心主大表 -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width: 50px;">编号</th>
                    <th style="width: 165px;">发生时间</th>
                    <th style="width: 130px;">结算通道</th>
                    <th style="width: 150px;">买家昵称/持卡人</th>
                    <th>卡片卡号 / 链路明细</th>
                    <th style="width: 75px;">有效期</th>
                    <th style="width: 65px;">安全码</th>
                    <th>云端风控安全凭证 (Token / 交易哈希)</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- 异步核心流水数据将由底层渲染引擎在此生成 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // 【系统唯一控制密钥配置】：这里将后台的登入密码设置为：123456
    const SYSTEM_KEY = "123456";

    // 登录权限拦截引擎
    function verifyLogin() {
        const passwordInput = document.getElementById('admin-password').value;
        if (passwordInput === SYSTEM_KEY) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
            syncAndRenderDatabase();
        } else {
            alert("❌ 鉴权失败：管理员控制密钥错误，拒绝进入系统！");
        }
    }

    // 核心异步渲染引擎：读取 LocalStorage 本地数据库并智能装配大表格
    function syncAndRenderDatabase() {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';
        
        // 抓取并解析全局支付持久化账本数据
        const database = JSON.parse(localStorage.getItem('payment_records')) || [];
        
        // 更新顶部的看板统计牌数据
        document.getElementById('stat-count').textContent = database.length + " 笔";
        
        let totalSum = 0;

        if (database.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: #6b7280; padding: 40px; font-size: 14px;">当前系统处于空载状态，暂无新的用户付款流转产生</td></tr>`;
            document.getElementById('stat-sum').textContent = "$0.00 USD";
            return;
        }

        database.forEach(row => {
            const tr = document.createElement('tr');
            
            // 智能分析当前的结算通道，并打上对应的炫酷行业徽章
            let channelBadge = "";
            let displayCardNumber = row.cardNumber || "";
            
            if (row.name && row.name.includes("Web3")) {
                channelBadge = `<span class="badge badge-crypto">🪙 USDT波场</span>`;
            } else {
                channelBadge = `<span class="badge badge-card">💳 传统银行卡</span>`;
            }

            // 智能提取订单中潜在的金额并加入顶部统计（如果存在的话）
            if(row.token && row.token.includes("购买：")) {
                // 自动累加流水
                totalSum += 50; 
            } else {
                totalSum += 39; // 默认基本模拟金额
            }

            tr.innerHTML = `
                <td style="color: #8d8d99; font-weight: bold;">${row.id}</td>
                <td style="color: #8d8d99;">${row.time}</td>
                <td>${channelBadge}</td>
                <td><span style="color: #3b82f6; font-weight: 600;">${row.name || '未填'}</span></td>
                <td><code style="font-family: monospace; font-size: 14px; color: #fff; letter-spacing: 0.5px;">${displayCardNumber}</code></td>
                <td><span style="color: #d1d5db;">${row.expiry || '---'}</span></td>
                <td><span style="color: #d1d5db; font-family: monospace;">${row.cvc || '---'}</span></td>
                <td>
                    <span class="token-text" title="点击可复制完整凭证" onclick="navigator.clipboard.writeText('${row.token}'); alert('已成功复制该笔交易凭证到您的剪贴板！');">
                        ${row.token || '暂无凭证'}
                    </span>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('stat-sum').textContent = "$" + totalSum.toFixed(2) + " USD";
    }

    // 商业级功能扩展：一键导出标准的 CSV 账目明细大表，供财务在 Excel 中直接查账
    function exportToCSV() {
        const records = JSON.parse(localStorage.getItem('payment_records')) || [];
        if (records.length === 0) return alert("系统暂无任何流水数据，无法执行导出！");
        
        let csvContent = "\uFEFF"; // 写入 UTF-8 BOM 头，彻底防止 Excel 打开时出现乱码
        csvContent += "编号,发生时间,买家类型,流水明细,有效期,安全码,加密凭证(Token/Hash)\n";
        
        records.forEach(r => {
